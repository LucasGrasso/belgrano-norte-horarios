name: tren_bn_horarios
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.2+3

environment:
  sdk: ^3.12.2
  # CI reads this exact version; matches the SDK in .metadata.
  flutter: 3.44.6

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  flutter_riverpod: ^3.3.2
  flutter_svg: ^2.3.0
  http: ^1.6.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  pdf_document: ^10.0.0
  pdf_graphics: ^10.0.0
  timezone: ^0.11.1
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - logo.svg
  fonts:
    - family: Segoe UI
      fonts:
        - asset: assets/fonts/segoeui.ttf
        - asset: assets/fonts/segoeuii.ttf
          style: italic
        - asset: assets/fonts/seguisb.ttf
          weight: 600
        - asset: assets/fonts/segoeuib.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_fg.png
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

