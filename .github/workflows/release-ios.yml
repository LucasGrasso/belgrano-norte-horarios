name: Build unsigned iOS IPA for self-signing

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      build-number:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUILD_NAME: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - name: Configure Flutter without Apple signing credentials
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get --enforce-lockfile
          flutter build ios --release --config-only --no-codesign --no-pub \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
      - name: Install locked CocoaPods dependencies
        working-directory: ios
        run: pod install --deployment
      - name: Build unsigned app
        run: |
          flutter build ios --release --no-codesign --no-pub \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
      - name: Package IPA for users to sign themselves
        run: |
          test -f build/ios/iphoneos/Runner.app/Info.plist
          mkdir -p build/ios/package/Payload dist
          cp -R build/ios/iphoneos/Runner.app build/ios/package/Payload/
          archive="$PWD/dist/belgrano-norte-unsigned.ipa"
          (cd build/ios/package && zip -qry "$archive" Payload)
          unzip -t "$archive"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-ios
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14
