name: Build signed Android release

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      build-number:
        type: string
        required: true
    secrets:
      keystore-base64:
        required: true
      keystore-password:
        required: true
      key-alias:
        required: true
      key-password:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.keystore-password }}
      ANDROID_KEY_ALIAS: ${{ secrets.key-alias }}
      ANDROID_KEY_PASSWORD: ${{ secrets.key-password }}
      BUILD_NAME: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate and install signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.keystore-base64 }}
        shell: bash
        run: |
          set -euo pipefail
          for key in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing Android signing secret: $key"
              exit 1
            fi
          done
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build directly installable APK
        run: |
          flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
      - name: Collect release assets
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/belgrano-norte.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
