name: Build signed Android release

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      build-number:
        type: string
        required: true
    secrets:
      keystore-base64:
        required: true
      keystore-password:
        required: true
      key-alias:
        required: true
      key-password:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.keystore-password }}
      ANDROID_KEY_ALIAS: ${{ secrets.key-alias }}
      ANDROID_KEY_PASSWORD: ${{ secrets.key-password }}
      BUILD_NAME: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate and install signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.keystore-base64 }}
        shell: bash
        run: |
          set -euo pipefail
          for key in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing Android signing secret: $key"
              exit 1
            fi
          done
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build universal and architecture-specific APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Explicit targets avoid --split-per-abi's versionCode offsets in
          # Flutter 3.44. Every variant can update any compatible older APK.
          for target in universal android-arm64 android-arm android-x64; do
            case "$target" in
              universal) platforms=android-arm,android-arm64,android-x64; filename=belgrano-norte.apk ;;
              android-arm64) platforms=$target; filename=belgrano-norte-arm64-v8a.apk ;;
              android-arm) platforms=$target; filename=belgrano-norte-armeabi-v7a.apk ;;
              android-x64) platforms=$target; filename=belgrano-norte-x86_64.apk ;;
            esac
            flutter build apk --release --no-pub --target-platform="$platforms" \
              --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
            cp build/app/outputs/flutter-apk/app-release.apk "dist/$filename"
          done
      - name: Verify APK architectures and report download sizes
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import zipfile

          variants = {
              'belgrano-norte.apk': {'armeabi-v7a', 'arm64-v8a', 'x86_64'},
              'belgrano-norte-arm64-v8a.apk': {'arm64-v8a'},
              'belgrano-norte-armeabi-v7a.apk': {'armeabi-v7a'},
              'belgrano-norte-x86_64.apk': {'x86_64'},
          }
          rows = ['| APK | Download size (MiB) |', '| --- | ---: |']
          for filename, expected in variants.items():
              path = Path('dist') / filename
              with zipfile.ZipFile(path) as apk:
                  for library in ('libflutter.so', 'libapp.so'):
                      actual = {
                          name.split('/')[1] for name in apk.namelist()
                          if name.startswith('lib/') and name.endswith('/' + library)
                      }
                      if actual != expected:
                          raise SystemExit(f'{filename}: {library} architectures {actual}, expected {expected}')
              rows.append(f'| `{filename}` | {path.stat().st_size / 1024**2:.2f} |')
          summary = '\n'.join(rows) + '\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(summary)
          PYTHON
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
